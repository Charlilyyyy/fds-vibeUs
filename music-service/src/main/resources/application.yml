spring:
  application:
    name: music-service

  datasource:
    url: jdbc:postgresql://localhost:5433/vibeus_music_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:vibeus-minio}
  secret-key: ${MINIO_SECRET_KEY:vibeus-minio-secret}
  buckets:
    artists: ${MINIO_BUCKET_ARTISTS:vibeus-artists}
    albums: ${MINIO_BUCKET_ALBUMS:vibeus-albums}
    tracks: ${MINIO_BUCKET_TRACKS:vibeus-tracks}
