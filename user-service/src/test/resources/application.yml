spring:
  datasource:
    url: jdbc:h2:mem:user_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: user-service-test
      auto-offset-reset: earliest
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 500
        default.api.timeout.ms: 1000
