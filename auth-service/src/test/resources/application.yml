spring:
  datasource:
    url: jdbc:h2:mem:auth_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 1000

user-service:
  url: http://localhost:8083

jwt:
  secret: test-jwt-secret-for-auth-service-unit-tests-32
  access-token-expiration: 3600000
