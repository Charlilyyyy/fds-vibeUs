spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/vibeus_auth_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # Override with JWT_SECRET in real environments (min 32 characters for HS256).
  secret: ${JWT_SECRET:vibeus-local-dev-jwt-secret-change-me-32chars}
  # Access token lifetime in milliseconds (default 1 hour).
  access-token-expiration: ${JWT_EXPIRATION_MS:3600000}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8083}
