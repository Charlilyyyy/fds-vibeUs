spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/vibeus_auth_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT and Feign user-service URL will be added when auth flows are implemented.
# USER_SERVICE_URL default: http://localhost:8083
